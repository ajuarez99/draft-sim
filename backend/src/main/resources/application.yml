# Every deployment-varying value is an env var with a local-dev default, so
# running this on your machine needs no environment at all and running it
# anywhere else needs no code change.

spring:
  application:
    name: draft-sim
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/draftsim}
    username: ${DB_USER:draftsim}
    password: ${DB_PASSWORD:draftsim}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    # Relative to the process working directory. bootRun from backend/ resolves
    # it; the Docker image sets WEIGHTS_FILE to an absolute path instead.
    import: optional:file:${WEIGHTS_FILE:../config/weights.yml}

server:
  port: ${PORT:8080}
  # The stat leaderboard is ~1.4 MB of JSON per window (spec 022 live check); gzip makes it ~0.3 MB.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

draftsim:
  security:
    # Empty means auth is OFF -- the local-dev default. Set API_TOKEN to any
    # long random string and every /api/** route except /api/health starts
    # requiring "Authorization: Bearer <token>".
    token: ${API_TOKEN:}
  admin:
    # Server-side operator secret, sent as X-Admin-Token. Blank means admin is
    # DISABLED and every admin-only route refuses (fail closed) -- unlike
    # `security.token` above, where blank turns the gate off. Never a VITE_ var.
    token: ${ADMIN_TOKEN:}
  # Spec 045 A4: how long the live Matchups read (Sleeper /league/{id} + /matchups/{leg}, together) may take
  # before it counts as "unavailable". ARBITRARY: hand-set, not measured against Sleeper's latency tail.
  # Its cache TTLs are spec 044's draftsim.lock-in.live-ttl-seconds / live-failure-ttl-seconds.
  live-week:
    timeout-ms: 2500
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  owner:
    # Blank means slot auto-detection is OFF -- the local-dev default. Set to
    # your own Sleeper user id to have the draft view auto-select your seat.
    sleeper-user-id: ${APP_OWNER_SLEEPER_USER_ID:}
  # Football valuation: false (the default) keeps picking Sleeper's pts_ppr / pts_half_ppr / pts_std
  # column; true scores each stored stat line under the league's own scoring. Flip only per
  # specs/036 contracts/parity.md decision rule -- it is a switch, not a model constant.
  projections:
    nfl-exact-scoring: false
  # AI weekly recap (specs/020-ai-weekly-recap). OFF unless RECAP_ENABLED=true AND a non-blank
  # ANTHROPIC_API_KEY env var (RecapEnabledCondition). The key is deliberately NOT a property here:
  # it is read from the environment only, so no properties record or log line can print it (F12).
  # Every number below is ARBITRARY -- a hand-set bound on spend and waiting, not a measured
  # optimum (research R2/R4, review F1/N7).
  # NEVER set ANTHROPIC_LOG=debug in production: the SDK then logs full request and response bodies
  # (that is league data). It redacts the key and auth headers either way, but not the bodies.
  recap:
    enabled: ${RECAP_ENABLED:false}
    model: ${RECAP_MODEL:claude-haiku-4-5}
    max-calls-per-league-per-day: 10   # Anthropic API calls (a grounding retry is 2), UTC day
    max-calls-per-day: 50              # across all leagues
    transient-retry-minutes: 15        # wait before retrying API_ERROR / RATE_LIMITED_UPSTREAM
    timeout-seconds: 60
    max-tokens: 2048                   # ~3x the expected recap; preview raises it for thinking models

sleeper:
  base-url: ${SLEEPER_BASE_URL:https://api.sleeper.app/v1}
  players-cache-ttl: PT24H

# ESPN league ingest (specs/035-espn-yahoo-ingest). base-url is the host EspnClient is allowed to
# talk to; it refuses any other host and never follows a redirect (plan F14).
espn:
  base-url: ${ESPN_BASE_URL:https://lm-api-reads.fantasy.espn.com/apis/v3}

# Key that seals stored ESPN cookies. Blank/invalid = private ESPN leagues disabled
# (CredentialCipher.isConfigured() is false); there is no plaintext fallback.
credentials:
  key: ${BK_CREDENTIAL_KEY:}

logging:
  level:
    com.ballknowers.draftsim: ${LOG_LEVEL:DEBUG}

# Automatic data refresh (specs/009-auto-data-refresh). The staleness / retry /
# week-finality / concurrency figures are constants in RefreshProperties, each
# labelled hand-set and arbitrary, not settings.
refresh:
  on-visit:
    # Tests set this false via a system property in build.gradle.kts (research R12).
    enabled: true
  # Blank means the daily route does not exist (research R8).
  secret: ${REFRESH_SECRET:}

# Historical draft game (specs/053-historical-draft-game). The import downloads the pinned Kaggle zip
# once, from an admin call, never on a user request; the SHA-256 is checked whatever URL is used.
historical:
  kaggle-zip-url: ${HISTORICAL_KAGGLE_ZIP_URL:https://www.kaggle.com/api/v1/datasets/download/loganlauton/nba-players-and-team-data?datasetVersionNumber=2}
  kaggle-zip-sha256: 7a127548ce7143e85540ea899c93bada25a5944344d7adb4cfc89645ef3d46a4
  era-threshold: 0.90        # hand-set (spec 053 FR-007, Allan 2026-11-02), not fitted
  rank-standard-games: 72    # hand-set (F6)
  rank-min-games: 20         # hand-set (F6)
  rank-lookback-seasons: 3   # hand-set (spec 053 F6 amended at build: 2 seasons missed Jordan 1995-96, whose last qualifying season was 1992-93)
  teams: 12
  rounds: 14
  reversal-round: 0          # Sleeper default: plain snake (F8)
  # Legacy Ball Knowers league scoring (FR-002, O1)
  scoring:
    pts: 0.5
    reb: 1
    ast: 1
    stl: 2
    blk: 2
    to: -1
    tpm: 0.5
    dd: 1
    td: 2
    bonus_pt_40p: 2
    bonus_pt_50p: 2
    bonus_reb_20p: 1
    bonus_ast_15p: 1
    tf: -2
    ff: -2
