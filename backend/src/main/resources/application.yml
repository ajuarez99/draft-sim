spring:
  application:
    name: draft-sim
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/draftsim
    username: draftsim
    password: draftsim
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:../config/weights.yml

server:
  port: 8080

sleeper:
  base-url: https://api.sleeper.app/v1
  # Players endpoint is ~5MB. Sleeper asks you to call it once a day, not per request.
  players-cache-ttl: PT24H

logging:
  level:
    com.ballknowers.draftsim: DEBUG
