# Scoring weights and model constants. External on purpose: when a second and
# third season of history accumulate these get fit, not hand-tuned, and the
# engine should not need to change.
#
# EVERY NUMBER IN THIS FILE IS A GUESS. None of it is fit to data. Treat the
# relative magnitudes as a starting point, not as a claim.

draftsim:
  scoring:
    football:
      # score = w_adp*valueDelta + w_pos*positionalPrior + w_need*rosterNeed + w_run*runPressure
      weights:
        adp: 1.00
        positionalPrior: 0.35
        rosterNeed: 0.50
        runPressure: 0.25

      # valueDelta = (adp - pick_no + reachBias) / adpScale, clamped.
      # Larger adpScale = value decays more slowly with distance from ADP,
      # which makes drafters look more willing to reach.
      adpScale: 12.0
      valueDeltaClamp: 3.0

      # Board value = exp(-adp / valueDecay). At 60, the 1.01 pick is worth
      # ~6x the pick at 1.10 and ~30x a pick at the 4/5 turn. That drop is
      # steeper than reality for RB/WR and flatter than reality for elite TE.
      valueDecay: 60.0

      # A bench player is not worthless (byes, injuries, upside). Floor on
      # rosterNeed so late-round depth does not score at exactly zero.
      benchFloor: 0.15

      # runPressure looks at the last N picks; a position appearing k times
      # contributes k/window, decayed by recency.
      runWindow: 6
      runRecencyDecay: 0.85

      # Positions nobody takes until the draft is nearly over, expressed as
      # "only inside the last N rounds". Real constraint, not a guess: Sleeper's
      # board enforces it and drafters follow it.
      #
      # Rounds remaining rather than a round number, because a round number only
      # encodes the rule for one league length. These values reproduce the old
      # earliestRound {K: 13, DEF: 12} exactly on a 15-round league (13 of 15
      # leaves 3 rounds; 12 of 15 leaves 4) and keep meaning the same thing on
      # a league of any other length.
      latestRounds:
        K: 3
        DEF: 4

      # Softmax temperature. ~0 = modal board, 1 = realistic variance, >2 = chaos.
      temperature: 1.0
      # How many available players get scored at each pick.
      candidatePool: 30

    basketball:
      # GUESS, copied verbatim from football's values as a starting point.
      # NONE of this is fit to basketball data -- per this file's header rule,
      # unfitted numbers stay labelled and are never tuned just to make a
      # later measurement agree. claude/multi-sport-and-rebrand.md Phase 4.
      weights:
        adp: 1.00
        positionalPrior: 0.35
        rosterNeed: 0.50
        runPressure: 0.25

      adpScale: 12.0
      valueDeltaClamp: 3.0
      valueDecay: 60.0
      benchFloor: 0.15
      runWindow: 6
      runRecencyDecay: 0.85

      # No basketball equivalent of "kickers go last" -- every position is
      # draftable from round 1, so this is empty rather than populated with a
      # guess. Left present (not omitted) because FootballRules hard-fails
      # when ITS OWN latestRounds is null/missing (guards against a stale
      # weights.yml predating the earliestRound->latestRounds rename);
      # BasketballRules does not currently read this field at all, so an
      # empty map here is a deliberate no-op, not a placeholder for a rule
      # that will show up later.
      latestRounds: {}

      # Softmax temperature and candidate pool width -- same meaning as football's.
      temperature: 1.0
      candidatePool: 30

  board:
    # Weight on observed draft order in the blend. 0.5 is a coin flip dressed as
    # a parameter. Change it freely. (What's left over after this and adp.ffc.weight
    # goes to sleeper_search_rank -- see BoardService.rebuild.)
    observedWeight: 0.5
    # Per sport (Phase 4) -- was a flat, untagged list. Each sport's board only
    # draws observed order from its own completed drafts.
    observedDrafts:
      nfl:
        - "1346366555776126976"   # (Foot) Ball Knowers 2026, 12-team PPR, complete
      nba:
        - "1141438341108498432"   # Ball Knowers 2024 NBA, complete
        - "1229352720230514688"   # Ball Knowers 2025 NBA, complete
    referenceTeams: 14
    # A pick is only scored for reach against a board captured within this many
    # days of the draft. Older picks stay unscored rather than being measured
    # against a board from a different season.
    maxBoardLagDays: 30

  # Fantasy Football Calculator: real market ADP from live mock drafts, scoring-
  # format aware. See claude/adp-sources.md. teams/format describe the ONE cell
  # fetched -- not the 8-14 matrix the doc designs, because this session found
  # FFC's `teams` parameter, though validated, currently returns identical data
  # across team counts on the same format (verified live, see FfcAdpService).
  # Building the full per-size matrix would model a distinction that isn't real
  # in the data yet. weight is another coin-flip parameter, same as observedWeight.
  #
  # Football-only: fantasyfootballcalculator.com has no basketball vendor, so
  # there is no equivalent block for NBA and none is planned -- see
  # claude/multi-sport-and-rebrand.md's "There is no FFC for basketball" note.
  # BoardService skips this fetch entirely for NBA (Phase 5); this section is
  # simply never read for that sport.
  adp:
    ffc:
      enabled: true
      teams: 14
      format: ppr
      year: 2026
      weight: 0.5
      minDrafts: 500

  priors:
    # Dirichlet pseudo-counts per (bucket, position) cell. With 2 drafts of
    # history this is doing most of the work; it is deliberately heavy.
    alpha: 8.0
    # How many equal slices of a draft P(position | when) is keyed on, per
    # sport (Phase 4 -- was a flat, football-only int). NOT a round count --
    # round index does not survive a change of league size, so the table is
    # keyed on fraction-of-draft instead. At 15 the buckets line up exactly
    # with the rounds of a 15-round (football) league; at 14, a 14-round
    # (basketball) league -- both identical to the old round-keyed table on
    # today's data, and correct on a league of any other shape.
    buckets:
      nfl: 15
      nba: 14

  # Per-manager parameters are shrunk toward the league mean:
  #   effective = (n/(n+k))*manager + (k/(n+k))*leagueMean
  # With two drafts observed and k=4, a manager's own history carries 1/3 weight.
  # k is deliberately large. Lower it only when more seasons exist.
  shrinkage:
    k: 4.0

  # Letter grades beside a rank (spec 013). ARBITRARY: not fitted to anything.
  # A grade is a way of reading a rank, never a measurement: percentile =
  # (rank - 1) / (teams - 1) * 100, 0 = best. A team gets the FIRST entry whose
  # maxPercentile is >= its percentile. Percentiles must strictly increase and
  # the last must be 100. Delete this whole block and every grade is simply
  # absent (the number beside it still shows); /api/health reports gradesLoaded.
  grades:
    cutoffs:
      - { maxPercentile: 8,   grade: "A+" }
      - { maxPercentile: 17,  grade: "A" }
      - { maxPercentile: 25,  grade: "A-" }
      - { maxPercentile: 33,  grade: "B+" }
      - { maxPercentile: 42,  grade: "B" }
      - { maxPercentile: 50,  grade: "B-" }
      - { maxPercentile: 58,  grade: "C+" }
      - { maxPercentile: 67,  grade: "C" }
      - { maxPercentile: 75,  grade: "C-" }
      - { maxPercentile: 92,  grade: "D" }
      - { maxPercentile: 100, grade: "F" }

  # Draft grades (spec 018). ARBITRARY: not fitted to anything. A position needs at least
  # this many graded picks in the draft to get a baseline (a line of production against
  # ln(pick number), fitted per position from that draft's own picks); positions with fewer
  # picks than this get no baseline and no value. Delete this block and draft grades report
  # NOT_CONFIGURED; /api/health reports draftGradesLoaded.
  draft-grades:
    min-picks-per-position: 8

  # Rivalry week (spec 034). ARBITRARY: every number here is hand-set, not fitted to anything
  # (specs/034-rivalry-schedule-grid research R5/R6). min-meetings: a pairing with fewer meetings than
  # this is labelled thin; 3 is the smallest count where a record can't be decided by one game's swing
  # between 1-1 and 2-0 (R5). playoff-bonus: added to a pair's score per WINNERS-BRACKET elimination
  # meeting (a final counts once, not per week). championship-bonus: added once if they met in a final.
  # max-managers: the exact matching is a bitmask DP, so it is capped; above this the section is
  # refused rather than approximated. Delete this block and the rivalry week answers CONFIG_MISSING.
  rivalry:
    min-meetings: 3
    playoff-bonus: 1.5
    championship-bonus: 2.5
    max-managers: 16

  # Minutes trends and streaming candidates (spec 019). ARBITRARY: every number here is hand-set,
  # not fitted (specs/019-minutes-streaming research R5, plan review F7). role-threshold-minutes:
  # recent minus season minutes at which a player is flagged a riser/faller. min-season-games:
  # games before a season minutes mean is shown. form-games / form-min-games: the "last N" points
  # window and the games it needs. recency-days: a player whose last game is more than this many days
  # before the season's latest game is excluded as stale. list-size / streaming-size: rows per list.
  # one-game-share: the share of multi-game starter-weeks credited as exactly one game, at or above
  # which the page says the league credits one game a week. Delete this block and the endpoint reports
  # NOT_CONFIGURED; /api/health reports playerTrendsLoaded.
  player-trends:
    role-threshold-minutes: 6
    min-season-games: 5
    form-games: 5
    form-min-games: 3
    recency-days: 14
    list-size: 10
    streaming-size: 20
    one-game-share: 0.9

  # Player stat analysis (spec 022). ARBITRARY: every number here is hand-set, not fitted
  # (specs/022-player-stat-analysis research R12). rank-min-games-share: share of the season's team
  # games a player must have played to be ranked. rank-min-minutes-per-game: minutes per game floor
  # for ranking. small-sample-minutes: total minutes below which a shooting/usage rate is flagged as
  # a small sample. recency-days: a player whose last game is more than this many days before the
  # season's latest game is stale. standout-min-prior-games: prior games needed before a game can
  # stand out. standout-ts-delta: true-shooting percentage points above OR below the player's season
  # TS% before that night.
  # standout-ts-min-attempts: true-shooting attempts (FGA + 0.44 FTA) a game needs for its TS% to count. standout-minutes-jump:
  # minutes above the player's last-5 mean before that night (free agents only). leaders-size: rows
  # per stat-leaders category. Delete this block and
  # the feature reports NOT_CONFIGURED; /api/health reports playerStatsLoaded.
  player-stats:
    rank-min-games-share: 0.5
    rank-min-minutes-per-game: 15
    small-sample-minutes: 100
    recency-days: 14
    standout-min-prior-games: 5
    standout-ts-delta: 15
    standout-ts-min-attempts: 10
    standout-minutes-jump: 10
    leaders-size: 5

  # Spec 022 (Cup-final decision, 2026-10-08). Hand-maintained, not fitted. Sleeper stores NBA Cup
  # championship games as ordinary regular-season games with real team codes; the NBA does not count
  # them in regular-season stats, so every real-basketball figure drops them (NbaGameLines). One id per
  # season, added by hand (Sleeper does not flag them). Quote the ids: a numeric-looking one must stay
  # a string. An empty or missing list means "exclude nothing".
  nba-games:
    excluded-game-ids:
      - "20241217_OKC_MIL"       # 2024-25 Cup final, OKC v MIL (2024-12-17)
      - "1305814461864501248"    # 2025-26 Cup final, NYK v SAS (2025-12-16)

  # Preseason roster strength (spec 030). ARBITRARY: both numbers are hand-set, not fitted
  # (specs/030-post-draft-season-view plan review S10/S11/N12). favorite-min-gap-pct: when the
  # top roster's projected total beats another roster's by LESS than this percentage (gap taken
  # over the lower total), the two are called a tie and no single favorite is named. It is kept
  # above 1 because the inputs carry errors bigger than that: one average game per starter reads
  # about 15% under what Sleeper credits, scoring bonuses are not projected, injuries are not
  # modelled, and the projections' own accuracy for this league has not been measured.
  # stale-after-days: past this many days since the source last changed its numbers, the page
  # says the projections are N days old instead of letting them read as current. Delete this block
  # and the app fails at startup (the values are validated positive), so a missing key cannot
  # silently bind to 0.
  preseason:
    favorite-min-gap-pct: 3.0
    stale-after-days: 3

  # Projection accuracy (spec 036). Every number here is ARBITRARY: hand-set before a single
  # sample existed, NOT fitted to any measured accuracy, and FR-014 forbids feeding a result back
  # into them. If a band split turns out lopsided the fix is to say so, not to retune it to look even.
  # min-samples: scored games (NBA) / player-weeks (NFL) below which the page says "too early"
  #   and prints no accuracy figure at all. A guess: about two NBA slates, about one NFL week.
  # min-cell: a breakdown row (one position, one band) with fewer samples than this shows its
  #   count and "too few", not a figure. A guess.
  # bands: lower edges, in league points, of the 2nd..last band of the PROJECTED value
  #   (nba [20,35,50] reads 0-20, 20-35, 35-50, 50+). Chosen to split a slate roughly in quarters;
  #   not measured.
  projection-accuracy:
    min-samples:
      nba: 500
      nfl: 300
    min-cell: 50
    bands:
      nba: [20, 35, 50]
      nfl: [5, 10, 17]

  # Projection snapshots (spec 036). ARBITRARY hand-set cutoffs, in America/New_York wall-clock on
  # the game's date: a fetched line only counts as "pre-game" before this time. Set before the
  # earliest regular tip-off / kickoff each sport has (NBA holiday matinees; NFL London 09:30 ET),
  # because Sleeper's feed carries a date but no start time. lookahead-days: how many days ahead of
  # today a game may be and still be captured. Deleting this block fails startup on purpose.
  projection-snapshot:
    cutoff-et:
      nba: "12:00"
      nfl: "09:00"
    lookahead-days: 7
