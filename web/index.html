<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical, og:* and twitter:* are written by the landingHtml()
         plugin in vite.config.ts (spec 050), from src/landingCopy.ts. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts (Phase 1 of claude/site-redesign.md). Loaded here rather than by an @import in
         styles.css so the stylesheet is not blocked on a third-party host. serve.json's CSP
         already allows fonts.googleapis.com and fonts.gstatic.com. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
