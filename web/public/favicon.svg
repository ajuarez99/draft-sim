<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- fill= is the sRGB fallback for the bg / teal tokens (styles.css) for renderers without CSS Color 4 support; style= (oklch) wins where it's supported -->
