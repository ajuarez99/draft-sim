       All text sits inside the centred 630x630 square (x 285..915) so a square crop keeps it.
       Colours are the app's dark tokens as sRGB; no real names or league data. -->
  <rect width="1200" height="630" fill="#040913"/>
  <!-- abstract tiles in the four group tints, behind the text and clear of the square -->
  <g opacity="0.9">
    <rect x="40" y="60" width="200" height="120" rx="14" fill="#0b2a2b" stroke="#1f9d94" stroke-width="2"/>
